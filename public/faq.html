<script>
(function(){
  var ok=false; try{ ok=localStorage.getItem('disclosure-ack')==='v2'; }catch(e){}
  var box=document.getElementById('faq-body'), lock=document.getElementById('faq-lock');
  if(!ok){ lock.hidden=false; return; }

})();
</script>
